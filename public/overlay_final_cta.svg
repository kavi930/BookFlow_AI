<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bf-mac-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #FFFFFF; }
      .bf-mac-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: #94A3B8; }
      .bf-mac-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 700; fill: #A5D6A7; letter-spacing: 1px; }
      .bf-mac-metric-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #81C784; }
      .bf-mac-metric-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #CBD5E1; }
    </style>
  </defs>

  <!-- Solid Studio Closing Card covering MacBook screen and old text completely -->
  <rect x="90" y="160" width="1100" height="520" rx="20" fill="#07140D" stroke="#2D5A43" stroke-width="2.5" />

  <!-- Background subtle glow inside screen -->
  <circle cx="640" cy="400" r="280" fill="#143324" opacity="0.4" />

  <!-- MacBook Screen Top Status Bar -->
  <rect x="90" y="160" width="1100" height="40" rx="20" fill="#0C1F15" />
  <rect x="90" y="180" width="1100" height="20" fill="#0C1F15" />
  <line x1="90" y1="200" x2="1190" y2="200" stroke="#1E3A2F" stroke-width="1.2" />
  
  <!-- Window dots -->
  <circle cx="120" cy="180" r="5" fill="#EF4444" />
  <circle cx="136" cy="180" r="5" fill="#F59E0B" />
  <circle cx="152" cy="180" r="5" fill="#10B981" />

  <!-- Top bar logo & URL -->
  <rect x="180" y="168" width="18" height="18" rx="4.5" fill="#1E3A2F" stroke="#81C784" stroke-width="1" />
  <text x="185.5" y="181.5" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="206" y="182" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">BookFlow_AI</text>

  <!-- Simulated Browser URL bar -->
  <rect x="420" y="168" width="440" height="24" rx="6" fill="#13261C" stroke="#234533" stroke-width="1" />
  <circle cx="436" cy="180" r="3.5" fill="#81C784" />
  <text x="448" y="184" font-family="monospace" font-size="10.5" fill="#94A3B8">https://bookflow.ai/clinic-intake/live-demo</text>

  <!-- Live Pulse Badge in screen -->
  <rect x="510" y="235" width="260" height="28" rx="14" fill="#13261C" stroke="#81C784" stroke-width="1.2" />
  <circle cx="530" cy="249" r="4.5" fill="#4ADE80" />
  <text x="542" y="253.5" class="bf-mac-tag">BOOKFLOW_AI LIVE DEMO</text>

  <!-- Main Headline in screen -->
  <text x="640" y="318" class="bf-mac-title" text-anchor="middle">Book Your BookFlow_AI Live Demo</text>
  
  <!-- Sub-bullet points -->
  <text x="640" y="356" class="bf-mac-sub" text-anchor="middle">Automated Clinic Intake · WhatsApp Confirmations · Zero Double Bookings</text>

  <!-- 3 Performance Metric Badges inside screen -->
  <g transform="translate(240, 395)">
    <rect x="0" y="0" width="220" height="72" rx="12" fill="#0D2016" stroke="#1E3A2F" stroke-width="1.2" />
    <text x="110" y="32" class="bf-mac-metric-num" text-anchor="middle">99.4%</text>
    <text x="110" y="55" class="bf-mac-metric-lbl" text-anchor="middle">Intake Completion Rate</text>
  </g>

  <g transform="translate(510, 395)">
    <rect x="0" y="0" width="260" height="72" rx="12" fill="#0D2016" stroke="#1E3A2F" stroke-width="1.2" />
    <text x="130" y="32" class="bf-mac-metric-num" text-anchor="middle">&lt; 15 Mins</text>
    <text x="130" y="55" class="bf-mac-metric-lbl" text-anchor="middle">Clinic Practice Onboarding</text>
  </g>

  <g transform="translate(820, 395)">
    <rect x="0" y="0" width="220" height="72" rx="12" fill="#0D2016" stroke="#1E3A2F" stroke-width="1.2" />
    <text x="110" y="32" class="bf-mac-metric-num" text-anchor="middle">24/7</text>
    <text x="110" y="55" class="bf-mac-metric-lbl" text-anchor="middle">Instant Patient Scheduling</text>
  </g>

  <!-- Simulated CTA Button in Screen -->
  <rect x="470" y="505" width="340" height="46" rx="10" fill="#1E3A2F" stroke="#81C784" stroke-width="1.5" />
  <text x="640" y="534" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Schedule Live Clinic Walkthrough →</text>

  <!-- Screen Footer Note -->
  <text x="640" y="590" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Zero software installation required · 100% HIPAA &amp; Patient Data Compliant</text>
</svg>
