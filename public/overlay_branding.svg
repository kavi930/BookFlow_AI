<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bf-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .bf-card { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .bf-tab { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #334155; }
      .bf-url { font-family: monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .bf-bot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <!-- 1. Browser Tab -->
  <rect x="98" y="17" width="116" height="19" fill="#FFFFFF" rx="2" />
  <rect x="101" y="20.5" width="12" height="12" rx="2.5" fill="#1E3A2F" />
  <text x="104" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="117" y="30.5" class="bf-tab">BookFlow_AI</text>

  <!-- 2. Browser URL Address Bar -->
  <rect x="118" y="49" width="265" height="22" fill="#F1F3F5" rx="4" />
  <text x="126" y="64" class="bf-url">bookflow.ai/clinic-intake/dr-aarav</text>

  <!-- 3. Webpage Top Navbar Logo -->
  <rect x="98" y="79" width="175" height="30" fill="#FFFFFF" />
  <rect x="102" y="84" width="20" height="20" rx="5" fill="#1E3A2F" />
  <text x="107" y="99" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="129" y="99.5" class="bf-title">BookFlow_AI</text>

  <!-- 4. Card Sidebar Logo -->
  <rect x="188" y="159" width="128" height="30" fill="#FFFFFF" />
  <rect x="192" y="164" width="19" height="19" rx="4.5" fill="#1E3A2F" />
  <text x="197" y="178.5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="217" y="178.5" class="bf-card">BookFlow_AI</text>

  <!-- 5. Bottom Left User Profile Card Text -->
  <rect x="198" y="607" width="80" height="13" fill="#FFFFFF" />
  <text x="199" y="617" class="bf-bot">BookFlow_AI</text>
</svg>