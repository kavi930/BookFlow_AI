<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bf-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
      .bf-tab { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #334155; }
      .bf-url { font-family: monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .bf-doc-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .bf-doc-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>

  <!-- 1. Browser Tab 1 (Background Tab) -->
  <rect x="42" y="17" width="55" height="19" fill="#E2E8F0" rx="2" />
  <rect x="46" y="20.5" width="12" height="12" rx="2.5" fill="#1E3A2F" />
  <text x="49.5" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">B</text>

  <!-- 2. Browser Tab 2 (Active Tab) -->
  <rect x="98" y="17" width="135" height="19" fill="#FFFFFF" rx="2" />
  <rect x="101" y="20.5" width="12" height="12" rx="2.5" fill="#1E3A2F" />
  <text x="104" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="117" y="30.5" class="bf-tab">BookFlow_AI Confirmed</text>

  <!-- 3. Browser URL Address Bar -->
  <rect x="118" y="49" width="310" height="22" fill="#F1F3F5" rx="4" />
  <text x="126" y="64" class="bf-url">bookflow.ai/clinic-intake/confirmed</text>

  <!-- 4. Webpage Top Navbar Logo -->
  <rect x="98" y="79" width="175" height="30" fill="#FFFFFF" />
  <rect x="102" y="84" width="20" height="20" rx="5" fill="#1E3A2F" />
  <text x="107" y="99" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">B</text>
  <text x="129" y="99.5" class="bf-title">BookFlow_AI</text>

  <!-- 5. Confirmation Card Doctor Title & Subtitle -->
  <rect x="430" y="407" width="165" height="15" fill="#FFFFFF" />
  <text x="432" y="419" class="bf-doc-title">BookFlow_AI Clinic Practice</text>

  <rect x="430" y="423" width="250" height="14" fill="#FFFFFF" />
  <text x="432" y="433.5" class="bf-doc-sub">BookFlow_AI Confirmed · Aug 27, 2024, 10:00 PM</text>
</svg>
